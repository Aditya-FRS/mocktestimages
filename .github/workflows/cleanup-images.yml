name: 1. Delete Recent Images (3 Hours)
on: workflow_dispatch

permissions:
  contents: write

jobs:
  delete-recent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter and delete images by filename timestamp
        run: |
          # Calculate millisecond threshold for 3 hours ago
          NOW_MS=$(date +%s%3N)
          THRESHOLD_MS=$((NOW_MS - 10800000))
          
          echo "Looking for image filenames with timestamps newer than: $THRESHOLD_MS"
          
          for filepath in exam-images/*.*; do
            filename=$(basename "$filepath")
            
            # Extract the 13-digit timestamp from the filename
            if [[ $filename =~ ([0-9]{13}) ]]; then
              file_ts=${BASH_REMATCH}
              
              if [ "$file_ts" -gt "$THRESHOLD_MS" ]; then
                echo "Deleting recent image: $filename"
                rm -f "$filepath"
              fi
            fi
          done

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add exam-images/
          git diff-index --quiet HEAD || (git commit -m "Delete images from last 3 hours" && git push origin main)
