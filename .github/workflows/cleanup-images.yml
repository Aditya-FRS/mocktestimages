name: Delete Recent Exam Images
on: workflow_dispatch

# This block fixes the exit code 128 error by allowing changes to be pushed
permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete images from last 3 hours in exam-images
        run: |
          find exam-images -type f \( -name "*.jpg" -o -name "*.jpeg" -o -name "*.png" -o -name "*.webp" \) -mmin -180 -delete

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add exam-images
          git diff-index --quiet HEAD || (git commit -m "Remove recent exam images" && git push)
