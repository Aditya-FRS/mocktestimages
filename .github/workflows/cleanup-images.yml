name: Delete Recent Exam Images
on: workflow_dispatch

permissions:
  contents: write

jobs:
  cleanup-recent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessary to read git history logs

      - name: Find and delete images committed in the last 3 hours
        run: |
          # 1. Get a list of files added or modified in commits over the last 3 hours (180 mins)
          FILES=$(git log --since="180 minutes ago" --name-only --pretty=format: | grep -E '^exam-images/.*\.(png|jpg|jpeg|webp)$' | sort -u)
          
          if [ -z "$FILES" ]; then
            echo "No images found from the last 3 hours."
            exit 0
          fi

          echo "Found these recent images to delete:"
          echo "$FILES"

          # 2. Delete only those specific files
          echo "$FILES" | xargs rm -f

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          # Add the changes from the exam-images directory
          git add exam-images/
          git diff-index --quiet HEAD || (git commit -m "Delete only pictures added in last 3 hours" && git push origin main)
